<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPG-Tracker | Game Tracker</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-soft: #1f2937;
        --card: #0b1220;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #7c3aed;
        --accent-2: #22c55e;
        --border: rgba(255,255,255,0.1);
        --shadow: 0 10px 30px rgba(0,0,0,0.35);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #020817 0%, #0f172a 100%);
        color: var(--text);
      }

      a { color: inherit; text-decoration: none; }

      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 20px 60px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
        padding: 14px 20px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border);
        border-radius: 14px;
      }

      .brand {
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .nav {
        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 10px;
      }

      .nav a {
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
      }

      .nav a.primary {
        background: linear-gradient(135deg, var(--accent), #4f46e5);
        border-color: transparent;
        font-weight: 700;
      }

      .hero {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 22px 24px;
        box-shadow: var(--shadow);
        margin-bottom: 24px;
      }

      .hero h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 3vw, 2.8rem);
      }

      .hero p {
        margin: 0;
        color: var(--muted);
      }

      .layout {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 20px;
      }

      .sidebar,
      .content {
        background: rgba(15, 23, 42, 0.94);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      .sidebar {
        padding: 18px;
      }

      .sidebar-section + .sidebar-section {
        margin-top: 22px;
      }

      .sidebar h2,
      .content h2 {
        margin: 0 0 12px;
        font-size: 1.2rem;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 14px;
      }

      .field label {
        color: var(--muted);
        font-size: 0.9rem;
      }

      input, select, button {
        font: inherit;
      }

      input, select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .button {
        width: auto;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        cursor: pointer;
      }

      .button.primary {
        background: linear-gradient(135deg, var(--accent-2), #0ea5e9);
        color: #08111d;
        border-color: transparent;
        font-weight: 800;
      }

      .favorites-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .favorite-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 10px;
        padding: 8px 10px;
      }

      .favorite-item small {
        color: var(--muted);
      }

      .favorite-item button {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.12);
        color: var(--text);
        border-radius: 8px;
        padding: 4px 8px;
        cursor: pointer;
      }

      .content {
        padding: 18px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .stat {
        background: rgba(17, 24, 39, 0.85);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 12px;
        padding: 14px 12px;
      }

      .stat strong {
        display: block;
        font-size: 1.7rem;
        margin-bottom: 6px;
      }

      .stat span {
        color: var(--muted);
      }

      .results {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .game-card {
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(17, 24, 39, 0.95));
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 14px;
        padding: 14px;
      }

      .game-card h3 {
        margin: 0 0 8px;
        font-size: 1.18rem;
      }

      .game-card p {
        margin: 6px 0;
        color: var(--muted);
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .chip {
        display: inline-block;
        padding: 5px 8px;
        background: rgba(124, 58, 237, 0.14);
        border: 1px solid rgba(124, 58, 237, 0.4);
        border-radius: 999px;
        color: #d7c8ff;
        font-size: 0.78rem;
      }

      .card-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
      }

      .tiny-btn {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.12);
        color: var(--text);
        border-radius: 10px;
        padding: 7px 10px;
        cursor: pointer;
      }

      .tiny-btn.favorite-active {
        background: rgba(34, 197, 94, 0.15);
        border-color: rgba(34, 197, 94, 0.45);
      }

      .empty-state {
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand">RPG-Tracker</div>
        <nav class="nav" aria-label="Main navigation">
          <a href="./index.html">Recommendation Quiz</a>
          <a class="primary" href="./tracker.html">Game Tracker</a>
        </nav>
      </header>

      <header class="hero">
        <h1>Explore your RPG library</h1>
        <p>Search, filter, and favorite games from the RPG dataset.</p>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <div class="sidebar-section">
            <h2>Filters</h2>
            <div class="field">
              <label for="search-input">Search titles</label>
              <input id="search-input" type="text" placeholder="Search by title or keyword" />
            </div>
            <div class="field">
              <label for="platform-filter">Platform</label>
              <select id="platform-filter">
                <option value="all">All platforms</option>
              </select>
            </div>
            <div class="field">
              <label for="setting-filter">Setting</label>
              <select id="setting-filter">
                <option value="all">All settings</option>
              </select>
            </div>
            <div class="field">
              <label for="sort-select">Sort by</label>
              <select id="sort-select">
                <option value="year-desc">Year (newest first)</option>
                <option value="year-asc">Year (oldest first)</option>
                <option value="title-asc">Title (A–Z)</option>
              </select>
            </div>
            <div class="button-row">
              <button id="reset-filters" class="button" type="button">Reset</button>
              <button id="favorites-toggle" class="button primary" type="button">Show favorites</button>
            </div>
          </div>

          <div class="sidebar-section">
            <h2>Favorites</h2>
            <div id="favorites-list" class="favorites-list"></div>
          </div>
        </aside>

        <section class="content">
          <div class="stats">
            <div class="stat">
              <strong id="total-count">0</strong>
              <span>Games</span>
            </div>
            <div class="stat">
              <strong id="filtered-count">0</strong>
              <span>Visible</span>
            </div>
            <div class="stat">
              <strong id="favorite-count">0</strong>
              <span>Favorites</span>
            </div>
          </div>

          <h2>Results</h2>
          <div id="results" class="results" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script>
      const searchInput = document.getElementById('search-input');
      const platformFilter = document.getElementById('platform-filter');
      const settingFilter = document.getElementById('setting-filter');
      const sortSelect = document.getElementById('sort-select');
      const resultsContainer = document.getElementById('results');
      const totalCountEl = document.getElementById('total-count');
      const filteredCountEl = document.getElementById('filtered-count');
      const favoriteCountEl = document.getElementById('favorite-count');
      const favoritesList = document.getElementById('favorites-list');
      const favoritesToggle = document.getElementById('favorites-toggle');
      const resetFiltersButton = document.getElementById('reset-filters');

      const STORAGE_KEY = 'rpg-tracker-favorites';
      let allGames = [];
      let favorites = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      let favoritesMode = false;

      function normalizeText(value) {
        return String(value || '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, ' ')
          .trim();
      }

      function getUniqueValues(key) {
        const values = new Set();
        allGames.forEach((game) => {
          const value = game[key];
          if (Array.isArray(value)) {
            value.forEach((item) => item && values.add(item));
          } else if (value) {
            values.add(value);
          }
        });
        return Array.from(values).filter(Boolean).sort();
      }

      function fillFilters() {
        const platforms = getUniqueValues('platforms');
        const settings = getUniqueValues('setting');

        platformFilter.innerHTML = '<option value="all">All platforms</option>' + platforms
          .map((platform) => `<option value="${platform}">${platform}</option>`)
          .join('');

        settingFilter.innerHTML = '<option value="all">All settings</option>' + settings
          .map((setting) => `<option value="${setting}">${setting}</option>`)
          .join('');
      }

      function renderFavorites() {
        const favGames = allGames.filter((game) => favorites.includes(game.id));
        favoriteCountEl.textContent = String(favGames.length);

        if (!favGames.length) {
          favoritesList.innerHTML = '<p class="empty-state">No favorites yet.</p>';
          return;
        }

        favoritesList.innerHTML = favGames.map((game) => `
          <div class="favorite-item">
            <div>
              <strong>${game.title || 'Untitled'}</strong><br />
              <small>${game.release_year || 'Unknown year'}</small>
            </div>
            <button type="button" data-remove-favorite="${game.id}">Remove</button>
          </div>
        `).join('');

        document.querySelectorAll('[data-remove-favorite]').forEach((button) => {
          button.addEventListener('click', () => {
            toggleFavorite(button.dataset.removeFavorite);
          });
        });
      }

      function toggleFavorite(gameId) {
        if (favorites.includes(gameId)) {
          favorites = favorites.filter((id) => id !== gameId);
        } else {
          favorites.push(gameId);
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(favorites));
        renderFavorites();
        renderResults();
      }

      function addFavoriteButtonHandlers() {
        document.querySelectorAll('[data-favorite-id]').forEach((button) => {
          button.addEventListener('click', () => {
            toggleFavorite(button.dataset.favoriteId);
          });
        });
      }

      function getVisibleGames() {
        const searchTerm = normalizeText(searchInput.value);
        const platformValue = platformFilter.value;
        const settingValue = settingFilter.value;
        const sortValue = sortSelect.value;

        let result = allGames.filter((game) => {
          const titleMatch = !searchTerm || normalizeText(game.title).includes(searchTerm) || normalizeText(game.setting).includes(searchTerm) || (game.subgenres || []).some((subgenre) => normalizeText(subgenre).includes(searchTerm));
          const platformMatch = platformValue === 'all' || (game.platforms || []).includes(platformValue);
          const settingMatch = settingValue === 'all' || game.setting === settingValue;
          return titleMatch && platformMatch && settingMatch;
        });

        if (favoritesMode) {
          result = result.filter((game) => favorites.includes(game.id));
        }

        if (sortValue === 'year-desc') result = result.sort((a, b) => Number(b.release_year || 0) - Number(a.release_year || 0));
        if (sortValue === 'year-asc') result = result.sort((a, b) => Number(a.release_year || 0) - Number(b.release_year || 0));
        if (sortValue === 'title-asc') result = result.sort((a, b) => (a.title || '').localeCompare(b.title || ''));

        return result;
      }

      function renderResults() {
        const visibleGames = getVisibleGames();
        filteredCountEl.textContent = String(visibleGames.length);

        if (!visibleGames.length) {
          resultsContainer.innerHTML = '<p class="empty-state">No matches found. Try widening the filters or resetting them.</p>';
          return;
        }

        resultsContainer.innerHTML = visibleGames.map((game) => {
          const isFavorite = favorites.includes(game.id);
          const platformList = (game.platforms || []).slice(0, 3).join(', ') || 'Unknown';
          const subgenreList = (game.subgenres || []).slice(0, 2).join(', ') || 'RPG';
          const year = game.release_year || 'Unknown';
          return `
            <article class="game-card">
              <h3>${game.title || 'Untitled RPG'}</h3>
              <p><strong>Year:</strong> ${year}</p>
              <p><strong>Setting:</strong> ${game.setting || 'Unknown'}</p>
              <p><strong>Platforms:</strong> ${platformList}</p>
              <p><strong>Subgenre:</strong> ${subgenreList}</p>
              <div class="chip-row">
                ${(game.platforms || []).slice(0, 3).map((platform) => `<span class="chip">${platform}</span>`).join('')}
              </div>
              <div class="card-actions">
                <button class="tiny-btn ${isFavorite ? 'favorite-active' : ''}" type="button" data-favorite-id="${game.id}">${isFavorite ? '★ Favorited' : '☆ Favorite'}</button>
              </div>
            </article>
          `;
        }).join('');

        addFavoriteButtonHandlers();
      }

      function bindEvents() {
        searchInput.addEventListener('input', renderResults);
        platformFilter.addEventListener('change', renderResults);
        settingFilter.addEventListener('change', renderResults);
        sortSelect.addEventListener('change', renderResults);

        favoritesToggle.addEventListener('click', () => {
          favoritesMode = !favoritesMode;
          favoritesToggle.textContent = favoritesMode ? 'Show all games' : 'Show favorites';
          renderResults();
        });

        resetFiltersButton.addEventListener('click', () => {
          searchInput.value = '';
          platformFilter.value = 'all';
          settingFilter.value = 'all';
          sortSelect.value = 'year-desc';
          favoritesMode = false;
          favoritesToggle.textContent = 'Show favorites';
          renderResults();
        });
      }

      fetch('./role_playing_video_games.json')
        .then((response) => {
          if (!response.ok) {
            throw new Error('Dataset not found');
          }
          return response.json();
        })
        .then((data) => {
          allGames = Array.isArray(data.entries) ? data.entries : [];
          totalCountEl.textContent = String(allGames.length);
          fillFilters();
          renderFavorites();
          renderResults();
        })
        .catch((error) => {
          console.error(error);
          resultsContainer.innerHTML = '<p class="empty-state">Unable to load the RPG dataset. Please confirm the JSON file is in the repository root.</p>';
        });

      bindEvents();
    </script>
  </body>
</html>
